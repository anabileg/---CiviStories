<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviStories - وعي مجتمعي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #0b0b0b; 
            color: #f1f1f1; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .header { background: #000; padding: 20px 0; border-bottom: 3px solid #d4af37; }
        .logo { width: 150px; max-width: 40%; height: auto; border-radius: 50%; border: 2px solid #d4af37; }
        
        .container { 
            max-width: 90%; 
            width: 900px; 
            margin: 20px auto; 
            background: #181818; 
            padding: 20px; 
            border-radius: 15px; 
        }

        /* تنسيق معرض الصور */
        .image-gallery {
            display: grid;
            grid-template-columns: 1fr; /* صورة واحدة في الصف للموبايل */
            gap: 15px;
            margin: 25px 0;
        }
        @media (min-width: 600px) {
            .image-gallery { grid-template-columns: 1fr 1fr; } /* صورتين بجانب بعض للكمبيوتر */
        }
        .gallery-item {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #333;
            transition: transform 0.3s;
        }
        .gallery-item:hover { transform: scale(1.02); border-color: #d4af37; }

        .youtube-section { background: #c4302b; color: white; padding: 20px; border-radius: 15px; margin: 25px 0; text-decoration: none; display: block; }
        .yt-button { background: #fff; color: #c4302b; padding: 10px 20px; border-radius: 30px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .goals-box { text-align: right; background: #222; padding: 15px 25px; border-right: 5px solid #d4af37; border-radius: 10px; }
        .stats-container { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        
        @media (min-width: 600px) {
            .stats-container { flex-direction: row; }
            .container { padding: 40px; }
            .logo { width: 200px; }
        }

        .stat-card { background: #d4af37; color: #000; padding: 20px; border-radius: 15px; flex: 1; font-weight: bold; }
        .footer { padding: 30px 0; color: #666; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="header">
        <img src="Civis%20%D9%82%D8%B5%D8%B5%20%D8%A7%D9%84%D8%AD%D8%B6%D8%A7%D8%B1%D8%A7%D8%AA.png" alt="CiviStories Logo" class="logo">
    </div>

    <div class="container">
        <h1>مشروع CiviStories</h1>
        <p style="color: #ccc;">رسائل بصرية توضح أثر التكنولوجيا على حياتنا اليومية</p>

        <div class="image-gallery">
            <img src="1 (1).jpg" alt="إدمان الهاتف" class="gallery-item">
            <img src="Picture1.jpg" alt="تأثير السوشيال ميديا" class="gallery-item">
            <img src="1 (4).jpg" alt="انعزال الشباب" class="gallery-item">
            <img src="1 (3).jpg" alt="سباق الوقت الرقمي" class="gallery-item">
        </div>

        <a href="https://www.youtube.com/@CiviStories" target="_blank" class="youtube-section">
            <h3 style="margin:0;">🎥 اشترك في قناتنا الرسمية</h3>
            <div class="yt-button">YouTube</div>
        </a>

        <div class="goals-box">
            <h3 style="color: #d4af37; margin-top: 0;">أهدافنا:</h3>
            <ul style="padding-right: 20px;">
                <li>نشر الوعي بمخاطر الإدمان الرقمي.</li>
                <li>حماية الروابط الأسرية من التفكك.</li>
            </ul>
        </div>

        <div class="stats-container">
            <div class="stat-card"><span>70%</span><br>خلافات أسرية</div>
            <div class="stat-card"><span>40%</span><br>عزلة اجتماعية</div>
        </div>

        <div class="footer">
            <p>&copy; 2026 CiviStories - جميع الحقوق محفوظة</p>
        </div>
    </div>
</body>
</html>
