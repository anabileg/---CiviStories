<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CiviStories | اللابتوب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --gold: #d4af37; --white: #ffffff; --red-news: #b30000;
            --bg-dark: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; color: var(--white); 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
        }

        /* شريط التنقل */
        .navbar {
            height: 80px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold);
            position: fixed; top: 0; width: 100%; z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .nav-container { width: 95%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .nav-logo-img { height: 60px; }

        /* شريط الأخبار */
        .news-ticker { 
            background: var(--red-news); height: 40px; position: fixed; top: 80px; width: 100%; z-index: 1900; 
            display: flex; align-items: center; overflow: hidden; 
        }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 40s linear infinite; }
        .ticker-track span { padding-left: 50px; font-weight: bold; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }

        /* --- معرض الصور المحسن للابتوب --- */
        .media-section {
            margin-top: 150px;
            position: relative;
            width: 100%;
            padding: 20px 0;
            background: #000;
        }

        .carousel-container {
            width: 90%; /* نترك مساحة للأسهم */
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
        }

        .track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .track img {
            /* عرض الصورة هو ربع مساحة الحاوية (4 صور) */
            flex: 0 0 25%; 
            height: 450px;
            object-fit: cover; /* لملء الفراغات */
            padding: 5px;
            cursor: pointer;
            filter: grayscale(30%);
            transition: 0.4s;
        }

        .track img:hover {
            filter: grayscale(0%);
            transform: scale(1.02);
        }

        /* أزرار التنقل */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: var(--gold); color: #000; border: none;
            width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; z-index: 100; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .prev-btn { right: 1%; } /* السهم الأيمن للتقديم */
        .next-btn { left: 1%; }  /* السهم الأيسر للرجوع */

        /* الإحصائيات */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; padding: 50px 5%; margin-top: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--gold);
            padding: 40px; border-radius: 20px; text-align: center;
        }
        .stat-num { font-size: 3.5rem; color: var(--gold); display: block; margin-bottom: 10px; font-weight: bold; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a href="#media">ميديا</a>
                <a href="#stats">إحصائيات</a>
                <a href="#">رؤيتنا</a>
            </div>
            <img src="logo.png" class="nav-logo-img">
        </div>
    </nav>

    <div class="news-ticker">
        <div class="ticker-track">
            <span>• حالة طلاق كل دقيقتين بسبب الإدمان الرقمي</span>
            <span>• وزارة الأوقاف: الهواتف الذكية سبب رئيسي للخرس الزوجي</span>
            <span>• إنذار أحمر: التفكك الأسري يهدد الاستقرار المجتمعي</span>
        </div>
    </div>

    <section id="media" class="media-section">
        <button class="nav-btn prev-btn" onclick="moveSlide(-1)">❯</button>
        
        <div class="carousel-container">
            <div class="track" id="imageTrack">
                </div>
        </div>

        <button class="nav-btn next-btn" onclick="moveSlide(1)">❮</button>
    </section>

    <section id="stats" class="stats-grid">
        <div class="stat-card">
            <span class="stat-num">311</span>
            <p>ألف حالة طلاق سنوياً</p>
        </div>
        <div class="stat-card">
            <span class="stat-num">104</span>
            <p>مليون هاتف محمول في مصر</p>
        </div>
        <div class="stat-card">
            <span class="stat-num">15</span>
            <p>مليار جنيه خسائر إنتاجية</p>
        </div>
    </section>

    <script>
        // قائمة الصور (تأكد من وجودها في المجلد)
        const images = ["1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpg", "7.jpg", "8.jpg"];
        const track = document.getElementById('imageTrack');
        let index = 0;

        // توليد الصور
        images.forEach(img => {
            const imgElement = document.createElement('img');
            imgElement.src = img;
            track.appendChild(imgElement);
        });

        function moveSlide(step) {
            const totalImages = images.length;
            const visibleImages = 4;
            const maxIndex = totalImages - visibleImages;

            index += step;

            // حماية الحدود
            if (index < 0) index = 0;
            if (index > maxIndex) index = maxIndex;

            // التحريك بناءً على عرض الصورة الواحدة (25%)
            // نستخدم القيمة السالبة لأن الاتجاه RTL (اليمين لليسار)
            const moveValue = index * 25;
            track.style.transform = `translateX(${moveValue}%)`;
        }
    </script>
</body>
</html>
