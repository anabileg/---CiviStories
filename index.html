<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CiviStories | تسونامي الوهم الرقمي</title>
    <meta name="description" content="مبادرة حماية النسيج المجتمعي المصري من مخاطر التفكك الإلكتروني - توعية الأسرة المصرية من مخاطر الإدمان الرقمي">
    <meta name="keywords" content="توعية رقمية، الأسرة المصرية، إدمان الإنترنت، طلاق، إحصائيات مصر">
    <meta name="author" content="CiviStories Team">
    
    <meta property="og:title" content="CiviStories | تسونامي الوهم الرقمي">
    <meta property="og:description" content="مبادرة وطنية لحماية المجتمع من مخاطر التفكك الإلكتروني. تصفح الإحصائيات والكتاب الآن.">
    <meta property="og:image" content="https://anabileg.github.io/---CiviStories/CIVISTORIES%20Book.png">
    <meta property="og:type" content="website">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentProject",
      "name": "CiviStories",
      "alternateName": "تسونامي الوهم الرقمي",
      "description": "مبادرة حماية النسيج المجتمعي المصري من مخاطر التفكك الإلكتروني",
      "address": { "@type": "PostalAddress", "addressCountry": "EG" }
    }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; width: 100%; }
        
        /* تحسين الخلفية وتقليل كثافة الحركة لتجنب دوار الحركة */
        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('image_390e08.jpg') center/cover no-repeat;
            z-index: -1; animation: kenBurns 40s ease-in-out infinite alternate;
        }
        @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* الهيدر المتجاوب */
        .navbar {
            min-height: 70px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-container { width: 95%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo-img { height: 45px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        /* شريط الأخبار - تم تصغيره للموبايل */
        .news-ticker { background: var(--red-news); color: white; height: 35px; position: fixed; top: 70px; width: 100%; z-index: 1000; display: flex; align-items: center; overflow: hidden; }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 120s linear infinite; }
        .ticker-track span { padding-left: 100px; font-weight: bold; font-size: 0.95rem; }

        /* الهيرو المطور - مع مراعاة أداء الصور */
        .hero { min-height: 100vh; display: flex; align-items: center; padding: 140px 5% 40px; }
        .hero-container { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; justify-content: center; align-items: center; }
        .book-static { flex: 0 0 280px; text-align: center; }
        .book-static img { width: 100%; border-radius: 15px; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.4); }
        
        .carousel-wide { flex: 1; min-width: 300px; max-width: 500px; height: 400px; overflow: hidden; border: 2px solid var(--gold); border-radius: 20px; }
        .track { display: flex; width: max-content; animation: infiniteSlide 100s linear infinite; }
        .track img { width: 400px; height: 400px; object-fit: cover; }

        /* الأقسام والجداول */
        .section { padding: 40px 5%; }
        .glass-box { background: rgba(0,0,0,0.85); padding: 30px; border-radius: 25px; border: 1px solid var(--gold); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { text-align: center; padding: 25px; background: rgba(255,255,255,0.03); border-radius: 20px; border-bottom: 4px solid var(--gold); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); background: rgba(212,175,55,0.08); }

        .stat-num { font-size: 3rem; font-weight: bold; color: var(--gold); display: block; }
        .loss-num { color: var(--red-num) !important; }

        /* أزرار عائمة */
        .btn-whatsapp-float {
            position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff;
            padding: 10px 18px; border-radius: 30px; font-weight: bold; text-decoration: none;
            display: flex; align-items: center; gap: 8px; z-index: 10002; font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .navbar { padding: 10px; }
            .nav-links { display: none; } /* إخفاء الروابط في الموبايل لتقليل الزحام */
            .hero { padding-top: 120px; }
            .carousel-wide { height: 280px; }
            .track img { width: 280px; height: 280px; }
            .stat-num { font-size: 2.2rem; }
        }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }
        @keyframes infiniteSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>

    <div class="site-bg"></div>

    <nav class="navbar">
        <div class="nav-container">
            <img src="logo.png" class="nav-logo-img" alt="CiviStories Logo">
            <div class="nav-links">
                <a onclick="window.scrollTo({top: document.getElementById('about').offsetTop - 100, behavior: 'smooth'})">رؤيتنا</a>
                <a onclick="window.scrollTo({top: document.getElementById('stats').offsetTop - 100, behavior: 'smooth'})">إحصائيات</a>
            </div>
            <div style="display: flex; gap: 10px; font-size: 1.2rem;">
                <a href="https://wa.me/201009995015" target="_blank" style="color:#25D366"><i class="fab fa-whatsapp"></i></a>
                <a href="https://facebook.com" target="_blank" style="color:#1877F2"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </nav>

    <div class="news-ticker">
        <div class="ticker-track" id="ticker">
            <span>• الأزهر الشريف: حالة طلاق كل دقيقتين بسبب الإدمان الرقمي</span>
            <span>• إنذار أحمر: التفكك الأسري يهدد الاستقرار المجتمعي</span>
            <span>• قصة حضارة: مبادرة وطنية لاستعادة وعي الأسرة المصرية</span>
        </div>
    </div>

    <section class="hero">
        <div class="hero-container">
            <div class="book-static">
                <img src="CIVISTORIES Book.png" alt="كتاب تسونامي الوهم الرقمي">
                <a href="https://heyzine.com/flip-book/48ab3792ec.html" target="_blank" style="text-decoration:none; color:#000; background:var(--gold); padding:12px; display:block; margin-top:15px; border-radius:8px; font-weight:bold;">تصفح الكتاب</a>
            </div>
            <div class="carousel-wide">
                <div class="track" id="imageTrack">
                    </div>
            </div>
        </div>
    </section>

    <section id="stats" class="section">
        <div class="glass-box">
            <h2 style="text-align:center; color:var(--gold); margin-bottom:30px;">إحصائيات وواقع</h2>
            <div class="grid">
                <div class="card">
                    <span class="stat-num counter" data-target="311">0</span>
                    <p>ألف حالة طلاق سنوياً</p>
                </div>
                <div class="card">
                    <span class="stat-num loss-num counter" data-target="15">0</span>
                    <p>مليار جنيه خسائر إنتاجية</p>
                </div>
            </div>
        </div>
    </section>

    <a href="https://wa.me/201009995015" class="btn-whatsapp-float">
        <i class="fab fa-whatsapp"></i> شاركنا برأيك
    </a>

    <script>
        // تحسين أداء تحميل الصور بناءً على التحليل
        const images = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg"]; // تقليل الصور المبدئية للسرعة
        const track = document.getElementById('imageTrack');
        
        // إلحاق الصور بطريقة آمنة وأكثر كفاءة
        images.concat(images).forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.loading = "lazy"; // التحميل التدريجي
            img.alt = "CiviStories Gallery Image";
            track.appendChild(img);
        });

        // عداد الأرقام التفاعلي
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const target = +el.getAttribute('data-target');
                    let count = 0;
                    const inc = target / 40;
                    const update = setInterval(() => {
                        count += inc;
                        if (count >= target) { el.innerText = target; clearInterval(update); }
                        else { el.innerText = Math.floor(count); }
                    }, 30);
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.counter').forEach(c => observer.observe(c));
    </script>
</body>
</html>
