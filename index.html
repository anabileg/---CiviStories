<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviStories | تسونامي الوهم الرقمي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --white: #ffffff; --red-news: #b30000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; }

        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('image_390e08.jpg') center/cover no-repeat;
            z-index: -1; animation: kenBurns 40s ease-in-out infinite alternate;
        }
        @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* الهيدر الثابت المطور */
        .navbar {
            height: 80px; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; padding: 0 20px;
        }

        .nav-container { width: 100%; display: flex; justify-content: space-between; align-items: center; }

        /* الجهة اليسرى: ثابتة دائماً */
        .nav-left { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .nav-logo-img { height: 50px; }
        .lang-toggle { background: var(--gold); border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; color: #000; font-size: 0.85rem; }
        .icon-wa { color: #25D366; font-size: 1.5rem; text-decoration: none; }
        .icon-mail { color: #fff; font-size: 1.4rem; text-decoration: none; }

        /* الروابط في المنتصف */
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; }

        /* الجهة اليمنى: أيقونات التواصل الاجتماعي بألوانها */
        .nav-social-right { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .nav-social-right a { font-size: 1.3rem; text-decoration: none; transition: 0.3s; }
        .nav-social-right a:hover { transform: scale(1.2); }
        .fa-facebook { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-tiktok { color: #fff; }
        .fa-x-twitter { color: #fff; }
        .fa-youtube { color: #FF0000; }
        .fa-linkedin { color: #0A66C2; }
        .fa-pinterest { color: #E60023; }

        /* شريط الأخبار */
        .news-ticker { background: var(--red-news); color: white; height: 40px; position: fixed; top: 80px; width: 100%; z-index: 1000; display: flex; align-items: center; overflow: hidden; }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 120s linear infinite; }
        .ticker-track span { padding-left: 80px; font-weight: bold; font-size: 1rem; }

        /* الهيرو: تم زيادة البادينج العلوي لضمان عدم الاختفاء */
        .hero { min-height: 100vh; display: flex; align-items: center; padding: 180px 5% 60px; }
        .hero-container { display: flex; flex-wrap: wrap; gap: 40px; width: 100%; justify-content: center; align-items: center; }
        
        .book-static { flex: 0 0 300px; text-align: center; }
        .book-static img { width: 100%; border-radius: 15px; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(212,175,55,0.5); }
        
        .carousel-wide { flex: 1; min-width: 320px; max-width: 800px; height: 450px; overflow: hidden; border: 2px solid var(--gold); border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .track { display: flex; width: max-content; animation: infiniteSlide 120s linear infinite; }
        .track img { width: 600px; height: 450px; object-fit: cover; border-right: 1px solid var(--gold); }

        .btn-read { text-decoration:none; color:#000; background:var(--gold); padding:15px; display:block; margin-top:20px; border-radius:10px; font-weight:bold; font-size: 1.1rem; transition: 0.3s; }
        .btn-read:hover { background: #fff; transform: scale(1.05); }

        /* أزرار عائمة */
        .btn-feedback { position: fixed; bottom: 20px; left: 20px; background: #25D366; color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: bold; text-decoration: none; z-index: 10002; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        @media (max-width: 992px) {
            .nav-links { display: none; }
            .navbar { height: 100px; }
            .news-ticker { top: 100px; }
            .hero { padding-top: 200px; }
            .track img { width: 350px; height: 300px; }
            .carousel-wide { height: 300px; }
        }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }
        @keyframes infiniteSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <img src="logo.png" class="nav-logo-img" alt="Logo">
                <button class="lang-toggle" onclick="toggleLanguage()" id="langBtn">English</button>
                <a href="https://wa.me/201009995015" target="_blank" class="icon-wa"><i class="fab fa-whatsapp"></i></a>
                <a href="mailto:civistories@gmail.com" class="icon-mail"><i class="fas fa-envelope"></i></a>
            </div>

            <div class="nav-links">
                <a onclick="scrollSection('about')">رؤيتنا</a>
                <a onclick="scrollSection('inst')">المؤسسات</a>
                <a onclick="scrollSection('stats')">إحصائيات</a>
            </div>

            <div class="nav-social-right">
                <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
                <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="#" target="_blank"><i class="fab fa-pinterest"></i></a>
            </div>
        </div>
    </nav>

    <div class="news-ticker">
        <div class="ticker-track" id="ticker">
            <span>• الأزهر الشريف: حالة طلاق كل دقيقتين بسبب الإدمان الرقمي</span>
            <span>• الكنيسة المصرية: 60% من النزاعات الأسرية سببها الفضاء الرقمي</span>
            <span>• وزارة الأوقاف: الهواتف الذكية سبب رئيسي للخرس الزوجي</span>
            <span>• إحصائيات: 7 ساعات يومياً هو متوسط استخدام المصريين للمنصات</span>
        </div>
    </div>

    <section class="hero">
        <div class="hero-container">
            <div class="book-static">
                <img src="CIVISTORIES Book.png" alt="Book Cover">
                <a href="https://heyzine.com/flip-book/48ab3792ec.html" target="_blank" class="btn-read">تصفح الكتاب | Read Book</a>
            </div>
            <div class="carousel-wide">
                <div class="track" id="imageTrack">
                    </div>
            </div>
        </div>
    </section>

    <a href="https://wa.me/201009995015" class="btn-feedback">
        <i class="fab fa-whatsapp"></i> شاركنا برأيك
    </a>

    <script>
        function initPage() {
            const imgs = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg"]; 
            const track = document.getElementById('imageTrack');
            // مضاعفة الصور لضمان سلاسة الحركة الدائرية
            imgs.concat(imgs).forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.loading = "lazy";
                track.appendChild(img);
            });
        }

        function toggleLanguage() {
            const h = document.documentElement;
            const b = document.getElementById('langBtn');
            if(h.dir === "rtl") {
                h.dir = "ltr";
                b.innerText = "عربي";
            } else {
                h.dir = "rtl";
                b.innerText = "English";
            }
        }

        function scrollSection(id) {
            window.scrollTo({ top: document.getElementById(id).offsetTop - 120, behavior: 'smooth' });
        }
    </script>
</body>
</html>
