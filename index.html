<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiviStories | تسونامي الوهم الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000;
            --wa-color: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; width: 100%; }

        /* خلفية الموقع المتحركة */
        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_390e08.jpg'); background-position: center; background-size: cover; z-index: -1;
            animation: kenBurns 35s ease-in-out infinite alternate;
        }
        @keyframes kenBurns { 0% { transform: scale(1); filter: brightness(0.35);} 100% { transform: scale(1.18); filter: brightness(0.55);} }

        /* التنسيقات العامة للنوبر والسكشنات */
        .navbar { min-height: 90px; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; }
        .nav-container { width: 95%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; margin: 0 10px; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }

        /* --- تعديل السلايدر لعرض 4 صور --- */
        .carousel-wide { 
            width: 100%; height: 450px; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); 
            position: relative; overflow: hidden; margin: 40px 0; background: #000;
        }
        .track { 
            display: flex; 
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
            width: max-content;
            height: 100%;
            align-items: center;
        }
        .track img { 
            width: 25vw !important; /* فرض ربع عرض الشاشة */
            height: 400px; 
            object-fit: contain; 
            cursor: zoom-in; 
            padding: 10px; 
            flex-shrink: 0;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(212,175,55,0.8);
            color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            z-index: 100; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* التجاوب مع الموبايل */
        @media (max-width: 768px) {
            .track img { width: 100vw !important; } /* صورة واحدة كاملة في الموبايل */
            .carousel-wide { height: 350px; }
        }

        /* الإحصائيات والكروت */
        .glass-box { text-align: center; border: 4px solid var(--gold); border-radius: 40px; padding: 40px 5%; margin: 20px 5%; background: rgba(0,0,0,0.6); position: relative; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { padding: 30px; background: rgba(255,255,255,0.05); border-radius: 20px; border-bottom: 4px solid var(--gold); }
        .stat-num { font-size: 3rem; color: var(--gold); font-weight: bold; }

        /* Lightbox */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 20000; }
        .lightbox img { max-width: 90%; max-height: 80%; border: 2px solid var(--gold); }
    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a onclick="scrollToSec('media-sec')">ميديا</a>
                <a onclick="scrollToSec('stats')">إحصائيات</a>
                <a href="https://forms.gle/1Ua2keC6kUvTbivK6" target="_blank">رأيك يهمنا</a>
            </div>
            <img src="logo.png" style="height: 60px;" alt="Logo">
        </div>
    </nav>

    <div style="height: 150px;"></div>

    <section id="media-sec" class="carousel-wide">
        <button class="nav-btn prev-btn" onclick="moveSlide(1)">❮</button>
        <div class="track" id="track-imgs"></div>
        <button class="nav-btn next-btn" onclick="moveSlide(-1)">❯</button>
    </section>

    <section id="stats" class="section">
        <div class="glass-box">
            <h2 style="color:var(--gold); margin-bottom:30px;">إحصائيات تهمك</h2>
            <div class="grid">
                <div class="card">
                    <span class="stat-num counter" data-target="311">0</span>
                    <p>ألف حالة طلاق سنوياً</p>
                </div>
                <div class="card">
                    <span class="stat-num counter" data-target="104">0</span>
                    <p>مليون هاتف محمول</p>
                </div>
            </div>
        </div>
    </section>

    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const imagesList = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg"];
        let currentSlide = 0;

        function initPage() {
            const track = document.getElementById('track-imgs');
            track.innerHTML = imagesList.map(img => `<img src="${img}" onclick="openImage('${img}')">`).join('');
        }

        function moveSlide(direction) {
            const track = document.getElementById('track-imgs');
            const step = window.innerWidth > 768 ? 25 : 100; // ربع شاشة للكمبيوتر وشاشة كاملة للموبايل
            const maxSlides = imagesList.length - (window.innerWidth > 768 ? 4 : 1);
            
            currentSlide += direction;

            if (currentSlide > maxSlides) currentSlide = 0;
            if (currentSlide < 0) currentSlide = maxSlides;
            
            // في الـ RTL، التحريك يكون بقيم موجبة للذهاب للصور التالية
            track.style.transform = `translateX(${currentSlide * step}vw)`;
        }

        function openImage(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function scrollToSec(id) {
            window.scrollTo({ top: document.getElementById(id).offsetTop - 100, behavior: 'smooth' });
        }

        // عداد الأرقام
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const target = +el.getAttribute('data-target');
                    let count = 0;
                    const update = setInterval(() => {
                        count += Math.ceil(target/50);
                        if (count >= target) { el.innerText = target; clearInterval(update); }
                        else { el.innerText = count; }
                    }, 30);
                }
            });
        });
        document.querySelectorAll('.counter').forEach(c => observer.observe(c));
    </script>
</body>
</html>
