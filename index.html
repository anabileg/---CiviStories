<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>منصة وعي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --light: #f8f9fa;
      --dark: #212529;
      --success: #4cc9f0;
      --accent: #f72585;
      --text: #333;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --shadow: rgba(0,0,0,0.1);
      --border: #e0e0e0;
    }

    [data-theme="dark"] {
      --primary: #4895ef;
      --secondary: #560bad;
      --light: #121212;
      --dark: #f8f9fa;
      --text: #e0e0e0;
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --shadow: rgba(0,0,0,0.3);
      --border: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
      line-height: 1.6;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--card-bg);
      padding: 1rem 0;
      box-shadow: 0 2px 10px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .language-selector,
    .theme-toggle,
    .font-size-control {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s;
    }

    .language-selector:hover,
    .theme-toggle:hover,
    .font-size-control:hover {
      border-color: var(--primary);
    }

    .hero {
      text-align: center;
      padding: 4rem 0;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      margin: 20px 0;
      border-radius: 15px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px var(--shadow);
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .programs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin: 30px 0;
    }

    .program-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px var(--shadow);
      transition: transform 0.3s;
      cursor: pointer;
    }

    .program-card:hover {
      transform: translateY(-8px);
    }

    .program-header {
      background: var(--primary);
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .program-body {
      padding: 20px;
    }

    .program-body ul {
      list-style: none;
    }

    .program-body li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.3s;
    }

    .program-body li:hover {
      color: var(--primary);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 15px;
      padding: 25px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    .faq-item {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: var(--text);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a href="#" class="logo" id="main-hero-title">منصة وعي</a>
        <ul class="nav-links">
          <li><a href="#vision" data-key="visionLink">رؤيتنا</a></li>
          <li><a href="#stats" data-key="statsLink">الإحصائيات</a></li>
          <li><a href="#programs" data-key="programsLink">برامج الوعي</a></li>
        </ul>
        <div class="controls">
          <select class="language-selector" id="languageSelector">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="tr">Türkçe</option>
            <option value="nl">Nederlands</option>
            <option value="sv">Svenska</option>
            <option value="pl">Polski</option>
            <option value="da">Dansk</option>
            <option value="fi">Suomi</option>
            <option value="no">Norsk</option>
            <option value="cs">Čeština</option>
            <option value="hu">Magyar</option>
            <option value="el">Ελληνικά</option>
            <option value="ro">Română</option>
          </select>
          <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
          </button>
          <button class="font-size-control" id="fontSizeUp">A+</button>
          <button class="font-size-control" id="fontSizeDown">A-</button>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <section class="hero">
      <h1 id="hero-title">منصة وعي</h1>
      <p id="hero-desc">نحو مجتمع واعٍ رقميًا</p>
    </section>

    <section id="stats" class="stats">
      <div class="stat-card">
        <div class="stat-number" id="usersCount">500K+</div>
        <div id="usersLabel">مستخدم نشط</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="programsCount">50+</div>
        <div id="programsLabel">برنامج توعوي</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countriesCount">30+</div>
        <div id="countriesLabel">دولة مستفيدة</div>
      </div>
    </section>

    <section id="programs">
      <h2 id="programsTitle">برامج الوعي</h2>
      <div class="programs-grid" id="programsGrid">
        <!-- سيتم ملؤها ديناميكيًا -->
      </div>
    </section>
  </div>

  <div class="modal" id="programModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>
    <p id="footerText">&copy; 2025 منصة وعي. جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    // =============================
    // البيانات الأساسية - العربية
    // =============================
    const programsData = [
      { category: 'child', q: 'ما هو السن المناسب لبدء استخدام الطفل للإنترنت؟', ans: 'يُوصى بعدم السماح للأطفال دون سن 3 سنوات باستخدام الشاشات، ومن 3-5 سنوات لا يزيد عن ساعة يوميًا تحت إشراف.', src: 'منظمة الصحة العالمية' },
      { category: 'child', q: 'كيف أحمي طفلي من التنمر الإلكتروني؟', ans: 'علّم طفلك عدم مشاركة بياناته الشخصية، وراقب نشاطه، وشجّعه على إخبارك بأي سلوك غريب.', src: 'اليونيسف' },
      { category: 'child', q: 'ما هي التطبيقات الآمنة للأطفال؟', ans: 'اختر تطبيقات خالية من الإعلانات، وتحتوي على أدوات رقابة أبوية، ومصنفة حسب العمر.', src: 'جمعية حماية الطفل' },
      { category: 'child', q: 'كيف أضبط إعدادات الخصوصية على أجهزة طفلي؟', ans: 'استخدم وضع "الطفل" أو "العائلة" في نظام التشغيل، وعطّل الشراء داخل التطبيق، وحدّد جهات الاتصال المسموح بها.', src: 'خبير أمن رقمي' },
      { category: 'child', q: 'هل يجب أن أعرف كلمات مرور طفلي؟', ans: 'نعم، كولي أمر، من حقك معرفتها لحمايته، لكن استخدمها بمسؤولية واحترام خصوصيته النامية.', src: 'مستشار تربوي' },
      { category: 'child', q: 'كيف أتعامل مع إدمان الطفل على الأجهزة؟', ans: 'ضع جدولًا زمنيًا واضحًا، ووفّر أنشطة بديلة (رياضة، قراءة)، ولا تستخدم الجهاز كوسيلة للعقاب أو المكافأة.', src: 'طبيب نفسي للأطفال' },
      { category: 'child', q: 'ما علامات تعرض الطفل لمحتوى غير لائق؟', ans: 'التغير المفاجئ في السلوك، العزلة، الكوابيس، أو استخدام كلمات جديدة غير مألوفة.', src: 'أخصائي نفسي' },
      { category: 'child', q: 'كيف أعلّم طفلي الخصوصية الرقمية؟', ans: 'ابدأ بشرح مبسط: "صورك واسمك ومكانك سرّ خاص لا يُشارك مع الغرباء".', src: 'مختص توعية رقمية' },
      { category: 'child', q: 'هل الفيديوهات التعليمية آمنة؟', ans: 'ليست جميعها، راقب المحتوى، وافضل القنوات الرسمية أو تلك المخصصة للأطفال.', src: 'خبير إعلامي' },
      { category: 'child', q: 'ما دور المدرسة في الحماية الرقمية؟', ans: 'يجب أن تدمج المدارس مفاهيم السلامة الرقمية في المناهج، وتنظم ورش عمل لأولياء الأمور.', src: 'وزارة التعليم' },
      { category: 'child', q: 'كيف أحمي طفلي من الابتزاز الإلكتروني؟', ans: 'علّمه ألا يلتقط صورًا شخصية، ولا يرد على رسائل غريبة، ويبلغك فورًا بأي تهديد.', src: 'وحدة الجرائم الإلكترونية' },
      { category: 'child', q: 'ما أفضل وقت لاستخدام الأجهزة؟', ans: 'تجنب الاستخدام قبل النوم بساعتين، ولا تسمح به أثناء الوجبات أو الواجبات المدرسية.', src: 'طبيب أطفال' },
      { category: 'child', q: 'هل الألعاب الإلكترونية مفيدة؟', ans: 'بعضها يعزز التفكير والتعاون، لكن اختر الألعاب التعليمية وحدد وقت اللعب.', src: 'أخصائي تربوي' },
      { category: 'child', q: 'كيف أتفاوض مع طفلي على وقت الشاشة؟', ans: 'اجعله شريكًا في تحديد القواعد، وكن قدوة في استخدامك الخاص.', src: 'مرشد أسري' },
      { category: 'child', q: 'ما المصادر الموثوقة للمحتوى العربي للأطفال؟', ans: 'ابحث عن محتوى من جهات تعليمية معروفة مثل وزارة التعليم أو قنوات تلفزيونية موثوقة.', src: 'خبير محتوى' },

      { category: 'teens', q: 'كيف أحمي خصوصيتي على وسائل التواصل؟', ans: 'اضبط إعدادات الخصوصية لتكون "الأصدقاء فقط"، ولا تشارك موقعك المباشر أو خططك المستقبلية.', src: 'خبير أمن سيبراني' },
      { category: 'teens', q: 'ماذا أفعل إذا تم اختراق حسابي؟', ans: 'غيّر كلمة المرور فورًا، وافحص الأجهزة المرتبطة، وأبلغ المنصة عن الحادث.', src: 'دعم تقني' },

      { category: 'teens', q: 'كيف أتعامل مع التنمر الإلكتروني؟', ans: 'لا ترد، احفظ الأدلة، وأبلغ المنصة ووالديك أو معلمك.', src: 'وحدة الدعم النفسي' },
      { category: 'teens', q: 'ما خطر التحديات الخطيرة على الإنترنت؟', ans: 'قد تؤدي إلى إصابات جسدية أو نفسية خطيرة، فلا تشارك في أي تحدٍّ يعرض سلامتك للخطر.', src: 'طبيب نفسي' },
      { category: 'teens', q: 'كيف أختار كلمة مرور قوية؟', ans: 'استخدم مزيجًا من أحرف كبيرة وصغيرة وأرقام ورموز، ولا تستخدم معلومات شخصية.', src: 'خبير سيبراني' },
      { category: 'teens', q: 'هل يمكن تتبعي عبر هاتفي؟', ans: 'نعم، عبر خدمات الموقع أو التطبيقات، لذا راجع أذونات التطبيقات بانتظام.', src: 'مختص تقني' },
      { category: 'teens', q: 'ما علامات الإدمان على الهاتف؟', ans: 'القلق عند فصله، وإهمال الدراسة أو النوم، والشعور بالذنب بعد الاستخدام.', src: 'أخصائي سلوكي' },
      { category: 'teens', q: 'كيف أحمي نفسي من الابتزاز؟', ans: 'لا ترسل صورًا أو مقاطع، وإذا حدث، لا تستسلم، بل أبلغ الجهات المختصة فورًا.', src: 'وحدة الجرائم الإلكترونية' },

      { category: 'teens', q: 'ما أهمية البصمة الرقمية؟', ans: 'كل ما تنشره يبقى للأبد، وقد يؤثر على فرصك المستقبلية في العمل أو الدراسة.', src: 'مستشار مهني' },
      { category: 'teens', q: 'كيف أوازن بين الحياة الرقمية والواقعية؟', ans: 'خصص وقتًا يوميًا للأنشطة الواقعية، واجعل أوقات الوجبات والعائلة خالية من الأجهزة.', src: 'مرشد نفسي' },

      { category: 'youth', q: 'هل من الآمن التسوق عبر الإنترنت؟', ans: 'نعم، إذا استخدمت مواقع موثوقة، وطرق دفع آمنة، وتجنبت الروابط المشبوهة.', src: 'خبير تجارة إلكترونية' },
      { category: 'youth', q: 'كيف أحمي نفسي من الاحتيال المالي؟', ans: 'لا تضغط على روابط غير معروفة، ولا تشارك بيانات بطاقتك، وتحقق من هوية المتصل.', src: 'بنك مركزي' },
      { category: 'youth', q: 'ما أهمية تحديث البرامج؟', ans: 'التحديثات تغلق الثغرات الأمنية، لذا فعّل التحديث التلقائي دائمًا.', src: 'مهندس أمن' },
      { category: 'youth', q: 'كيف أتعامل مع المعلومات المضللة؟', ans: 'تحقق من أكثر من مصدر، واستخدم أدوات التحقق من الحقائق، ولا تشارك دون تأكد.', src: 'صحفي محترف' },
      { category: 'youth', q: 'هل يمكن لصاحب العمل مراقبتي عبر الإنترنت؟', ans: 'في بيئة العمل، نعم، لذا استخدم أدوات الشركة لأغراض العمل فقط.', src: 'مستشار قانوني' },
      { category: 'youth', q: 'كيف أبني سمعة رقمية إيجابية؟', ans: 'شارك محتوى بنّاء، وتفاعل باحترام، واظهر مهاراتك واهتماماتك المهنية.', src: 'خبير تسويق' },
      { category: 'youth', q: 'ما خطر مشاركة بيانات الهوية؟', ans: 'قد تُستخدم لسرقة هويتك أو فتح حسابات باسمك، لذا كن حذرًا جدًّا.', src: 'وحدة مكافحة الاحتيال' },

      border-color: var(--primary);
    }

    .hero {

      padding: 4rem 0;

      margin: 20px 0;

      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .stats {

      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px var(--shadow);
      transition: transform 0.3s;
    }

    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .programs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin: 30px 0;
    }

    .program-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px var(--shadow);
      transition: transform 0.3s;
      cursor: pointer;
    }

    .program-card:hover {
      transform: translateY(-8px);
    }

    .program-header {
      background: var(--primary);
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .program-body {
      padding: 20px;
    }

    .program-body ul {
      list-style: none;
    }

    .program-body li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.3s;
    }

    .program-body li:hover {
      color: var(--primary);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 15px;
      padding: 25px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    .faq-item {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: var(--text);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

      let programs;
      switch(lang) {
        case 'en': programs = programsDataEn; break;

          teens: 'Adolescente Consciente',
          youth: 'Juventud Digital',
          marriage: 'Matrimonio Feliz',
          seniors: 'Adultos Mayores',
          security: 'Seguridad Digital'
        },
        de: {
          child: 'Digitales Kind',
          teens: 'Bewusster Teenager',
          youth: 'Digitale Jugend',
          marriage: 'Glückliche Ehe',
          seniors: 'Senioren',
          security: 'Digitale Sicherheit'
        },
        it: {
          child: 'Bambino Digitale',
          teens: 'Teen Consapevole',
          youth: 'Giovani Digitali',
          marriage: 'Matrimonio Felice',
          seniors: 'Anziani',
          security: 'Sicurezza Digitale'
        },
        pt: {
          child: 'Criança Digital',
          teens: 'Adolescente Consciente',
          youth: 'Juventude Digital',
          marriage: 'Casamento Feliz',
          seniors: 'Idosos',
          security: 'Segurança Digital'
        }
        // ... يمكن إضافة باقي اللغات
      };

      const lang = document.documentElement.lang;
      const labels = categoryLabels[lang] || categoryLabels['ar'];

      Object.keys(categories).forEach(cat => {
        const card = document.createElement('div');
        card.className = 'program-card';
        card.innerHTML = `
          <div class="program-header">${labels[cat]}</div>
          <div class="program-body">
            <ul>
              ${data.filter(item => item.category === cat).map((item, idx) => 
                `<li data-category="${cat}" data-index="${idx}">${item.q}</li>`
              ).join('')}
            </ul>
          </div>
        `;
        container.appendChild(card);
      });

      // إضافة مستمعات الأحداث للأسئلة
      container.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => {
          const cat = li.dataset.category;
          const idx = parseInt(li.dataset.index);
          openProgram(cat, idx, data);
        });
      });
    }

    // ========================================
    // دالة فتح نافذة البرنامج
    // ========================================
    function openProgram(category, index, data) {
      const item = data.find((d, i) => d.category === category && i === data.findIndex(x => x.category === category) + index);
      if (!item) return;

      const modal = document.getElementById('programModal');
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="faq-item">
          <div class="faq-question">${item.q}</div>
          <div class="faq-answer">${item.ans}</div>
          <div class="faq-source" style="font-size:0.9em;color:#666;margin-top:10px;">المصدر: ${item.src}</div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    // ========================================
    // تهيئة الصفحة
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      // تطبيق اللغة الافتراضية
      const savedLang = localStorage.getItem('selectedLanguage') || 'ar';
      document.getElementById('languageSelector').value = savedLang;
      applyLanguage(savedLang);

      // تغيير اللغة
      document.getElementById('languageSelector').addEventListener('change', (e) => {
        const lang = e.target.value;
        localStorage.setItem('selectedLanguage', lang);
        applyLanguage(lang);
      });

      // إغلاق النافذة
      document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('programModal').style.display = 'none';
      });

      window.addEventListener('click', (e) => {
        const modal = document.getElementById('programModal');
        if (e.target === modal) modal.style.display = 'none';
      });

      // تبديل السمة
      document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('themeToggle').innerHTML = isDark ? 
          '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      });

      // تحميل السمة المحفوظة
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
      }

      // التحكم بحجم الخط
      let fontSize = 16;
      document.getElementById('fontSizeUp').addEventListener('click', () => {
        fontSize = Math.min(fontSize + 2, 24);
        document.body.style.fontSize = fontSize + 'px';
        localStorage.setItem('fontSize', fontSize);
      });
      document.getElementById('fontSizeDown').addEventListener('click', () => {
        fontSize = Math.max(fontSize - 2, 12);
        document.body.style.fontSize = fontSize + 'px';
        localStorage.setItem('fontSize', fontSize);
      });

      // تحميل حجم الخط المحفوظ
      const savedFontSize = localStorage.getItem('fontSize');
      if (savedFontSize) {
        fontSize = parseInt(savedFontSize);
        document.body.style.fontSize = fontSize + 'px';
      }
    });
  </script>
</body>
</html>
