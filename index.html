<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviStories - وعي مجتمعي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --dark: #0b0b0b; --gray: #181818; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; background-color: var(--dark); color: #f1f1f1; margin: 0; padding: 0; 
        }

        /* شريط التنقل العلوي */
        .navbar {
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--gold);
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.9em; transition: 0.3s; }
        .nav-links a:hover { color: var(--gold); }

        .social-icons { display: flex; gap: 15px; align-items: center; }
        .social-icons a { color: white; font-size: 1.2em; transition: 0.3s; }
        .social-icons .fa-youtube:hover { color: #ff0000; }
        .social-icons .fa-whatsapp:hover { color: #25d366; }
        .social-icons .fa-envelope:hover { color: var(--gold); }

        .header { padding: 40px 0; background: black; }
        .logo { width: 150px; border-radius: 50%; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }

        .container { max-width: 900px; margin: 20px auto; background: var(--gray); padding: 30px; border-radius: 20px; }

        /* تنسيق الأزرار الجديدة في الشريط */
        .btn-contact {
            background: var(--gold);
            color: black !important;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* معرض الصور */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin: 30px 0;
        }
        .gallery-item { width: 100%; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
        .gallery-item:hover { transform: scale(1.03); border-color: var(--gold); }

        /* قسم اليوتيوب الرئيسي */
        .youtube-card {
            background: #c4302b; color: white; padding: 30px; border-radius: 15px;
            text-decoration: none; display: block; margin: 30px 0;
        }

        @media (max-width: 600px) {
            .nav-links { display: none; } /* إخفاء الروابط النصية في الموبايل لتجنب الزحام حالياً */
            .navbar { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="#"><i class="fas fa-info-circle"></i> من نحن</a>
            <a href="#"><i class="fas fa-bullseye"></i> أهدافنا</a>
            <a href="#"><i class="fas fa-chart-bar"></i> إحصاءات</a>
        </div>
        
        <div class="social-icons">
            <a href="mailto:anabileg@gmail.com" title="ايميل"><i class="fas fa-envelope"></i></a>
            <a href="https://www.youtube.com/@CiviStories" target="_blank" title="يوتيوب"><i class="fab fa-youtube"></i></a>
            <a href="https://wa.me/201009995015" target="_blank" class="btn-contact"><i class="fab fa-whatsapp"></i> تواصل معنا</a>
        </div>
    </nav>

    <div class="header">
        <img src="logo.png" alt="CiviStories Logo" class="logo">
    </div>

    <div class="container">
        <h1>CiviStories - وعي مجتمعي</h1>
        <p style="color: #bbb;">مبادرة لتسليط الضوء على أثر العالم الرقمي في واقعنا</p>

        <div class="image-gallery">
            <img src="img1.png" class="gallery-item">
            <img src="img2.png" class="gallery-item">
            <img src="img3.png" class="gallery-item">
            <img src="img4.png" class="gallery-item">
        </div>

        <a href="https://www.youtube.com/@CiviStories" target="_blank" class="youtube-card">
            <h2><i class="fab fa-youtube"></i> تابع قناتنا على اليوتيوب</h2>
            <p>شاهد قصصنا التوعوية وتفاعل مع المحتوى الهادف</p>
        </a>
    </div>

    <footer style="padding: 30px; color: #555; font-size: 0.8em;">
        &copy; 2026 CiviStories | anabileg@gmail.com
    </footer>

</body>
</html>
