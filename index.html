<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiviStories | ميديا متقدمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000;
            --yt: #FF0000; --fb: #1877F2; --tw: #ffffff; --ig: #E4405F; --tk: #ffffff; --pr: #BD081C; --in: #0077B5;
            --wa-color: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; width: 100%; }

        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_390e08.jpg'); background-position: center; background-size: cover; z-index: -1;
            animation: kenBurns 35s ease-in-out infinite alternate;
        }

        @keyframes kenBurns { 0% { transform: scale(1); filter: brightness(0.35);} 100% { transform: scale(1.18); filter: brightness(0.55);} }

        .navbar {
            min-height: 90px; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }

        .nav-container { 
            width: 95%; max-width: 1400px;
            display: flex; flex-direction: row; justify-content: space-between; align-items: center; direction: rtl;
        }
        
        .nav-right-group { display: flex; align-items: center; gap: 20px; }
        .nav-logo-img { height: 65px; }
        
        .social-icons { display: flex; gap: 12px; align-items: center; }
        .social-icons a { font-size: 1.2rem; transition: 0.3s; text-decoration: none; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .nav-links a:hover { color: #fff; }

        .ic-yt { color: var(--yt); } .ic-fb { color: var(--fb); } .ic-tw { color: var(--tw); }
        .ic-ig { color: var(--ig); } .ic-tk { color: var(--tk); } .ic-pr { color: var(--pr); }
        .ic-in { color: var(--in); } 

        .lang-toggle { background: var(--gold); border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; color: #000; font-size: 0.9rem; }

        .news-ticker { background: var(--red-news); color: white; height: 45px; position: fixed; top: 90px; width: 100%; z-index: 1000; display: flex; align-items: center; overflow: hidden; }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 900s linear infinite; }
        .ticker-track span { padding-left: 150px; font-weight: bold; font-size: 1.1rem; }

        @keyframes marquee { 0% { transform: translateX(0);} 100% { transform: translateX(100%);} }

        .hero { min-height: 100vh; display: flex; align-items: center; padding: 180px 5% 60px; }
        .hero-container { display: flex; gap: 40px; width: 100%; align-items: center; justify-content: center; }
        
        .book-static { flex: 0 0 320px; text-align: center; }
        .book-wrapper img { 
            width: 100%; border-radius: 15px; border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(212,175,55,0.3);
            animation: bookFloat 3s ease-in-out infinite;
        }

        @keyframes bookFloat { 0%, 100% { transform: translateY(0) rotate(0);} 50% { transform: translateY(-15px) rotate(2deg); } }

        .video-placeholder { flex: 1; height: 480px; border: 2px solid rgba(212,175,55,0.3); border-radius: 20px; }

        /* --- تعديل السلايدر لعرض 4 صور بجانب بعضها --- */
        .carousel-wide { 
            width: 100%; height: 350px; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); 
            position: relative; overflow: hidden; margin: 40px 0; background: rgba(0,0,0,0.8); display: flex; align-items: center;
        }
        .track { 
            display: flex; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); width: 100%; 
        }
        .track img { 
            min-width: 25%; /* عرض الصورة الواحدة هو ربع المساحة */
            height: 300px; object-fit: cover; cursor: zoom-in; padding: 10px; border-radius: 20px;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(212,175,55,0.8);
            color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            z-index: 10; font-size: 1.2rem; transition: 0.3s;
        }
        .nav-btn:hover { background: var(--gold); transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* موبايل: نعرض صورتين بدلاً من 4 لضمان الوضوح */
        @media (max-width: 768px) {
            .track img { min-width: 50%; height: 200px; }
            .carousel-wide { height: 250px; }
        }

        /* --- نظام Lightbox --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center; z-index: 20000;
        }
        .lightbox img { max-width: 90%; max-height: 85%; border: 3px solid var(--gold); border-radius: 10px; }
        .close-lightbox {
            position: absolute; top: 30px; right: 30px; color: #ff0000; font-size: 40px; cursor: pointer;
            font-weight: bold; background: none; border: none;
        }

        .vision-section, .glass-box { 
            text-align: center; border: 4px solid var(--gold); border-radius: 40px; padding: 60px 5%; margin: 40px 0;
            background-image: url('image_3a7328.jpg'); background-size: cover; background-position: center; position: relative; overflow: hidden;
        }
        .vision-section { margin: 40px 5%; }
        .vision-section::before, .glass-box::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 0;
        }
        .vision-section h2, .vision-section p, .glass-box h2, .glass-box .grid { position: relative; z-index: 1; }
        .section { padding: 40px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        
        .card { text-align: center; padding: 40px 25px; background: rgba(0,0,0,0.5); border-radius: 25px; border-bottom: 5px solid var(--gold); position: relative; transition: 0.4s; }
        .info-popup { visibility: hidden; width: 280px; background: var(--gold); color: #000; padding: 15px; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); opacity: 0; transition: 0.3s; border-radius: 12px; font-weight: bold; box-shadow: 0 10px 30px #000; z-index: 100; }
        .card:hover .info-popup { visibility: visible; opacity: 1; bottom: 115%; }

        .stat-num { font-size: 3.5rem; font-weight: bold; color: var(--gold); display: block; }
        .loss-num { color: var(--red-num) !important; }

        #btnUp { position: fixed; bottom: 100px; left: 20px; background: var(--gold); width: 45px; height: 45px; border-radius: 50%; display: none; align-items: center; justify-content: center; color: #000; cursor: pointer; z-index: 10002; transition: 0.3s; }
        
        .whatsapp-float {
            position: fixed; bottom: 30px; left: 20px; background-color: var(--wa-color);
            color: #FFF; border-radius: 50px; text-align: center; font-size: 30px;
            box-shadow: 2px 2px 15px rgba(0,0,0,0.5); z-index: 10002; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            animation: pulse-wa 2s infinite;
        }

        @keyframes pulse-wa {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .btn-action { text-decoration:none; color:#000; background:var(--gold); padding:15px; display:block; margin-top:20px; border-radius:10px; font-weight:bold; transition: 0.3s; }
        .btn-action:hover { background: #fff; transform: scale(1.05);}
    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>
    <div id="btnUp" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></div>

    <div id="lightbox" class="lightbox">
        <button class="close-lightbox" onclick="closeImage()">X</button>
        <img id="lightbox-img" src="">
    </div>

    <a href="https://wa.me/201009995015" class="whatsapp-float" target="_blank" title="دردشة الآن">
        <i class="fab fa-whatsapp"></i>
    </a>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a onclick="scrollToSec('about')" id="lnk-vision">رؤيتنا</a>
                <a onclick="scrollToSec('inst')" id="lnk-partners">الشركاء</a>
                <a onclick="scrollToSec('media-sec')" id="lnk-media">ميديا</a>
                <a onclick="scrollToSec('stats')" id="lnk-stats">إحصائيات</a>
                <a onclick="scrollToSec('losses')" id="lnk-losses">خسائر</a>
                <a href="https://forms.gle/1Ua2keC6kUvTbivK6" target="_blank" id="lnk-feedback">رأيك يهمنا</a>
            </div>

            <div class="nav-right-group">
                <div class="social-icons">
                    <a href="https://www.linkedin.com/..." target="_blank" class="ic-in"><i class="fab fa-linkedin"></i></a>
                    <a href="https://x.com/civistories" target="_blank" class="ic-tw"><i class="fab fa-x-twitter"></i></a>
                    <a href="https://www.facebook.com/..." target="_blank" class="ic-fb"><i class="fab fa-facebook"></i></a>
                    <a href="https://www.youtube.com/@CiviStories" target="_blank" class="ic-yt"><i class="fab fa-youtube"></i></a>
                </div>
                <button class="lang-toggle" onclick="toggleLanguage()" id="langBtn">English</button>
                <img src="logo.png" class="nav-logo-img" alt="Logo">
            </div>
        </div>
    </nav>

    <div class="news-ticker"><div class="ticker-track" id="tickerTrack"></div></div>

    <section class="hero" id="home">
        <div class="hero-container">
            <div class="book-static">
                <div class="book-wrapper"><img src="CIVISTORIES Book.png" alt="Book Cover"></div>
                <a href="https://heyzine.com/flip-book/48ab3792ec.html" target="_blank" id="btn-browse" class="btn-action">تصفح الكتاب</a>
            </div>
            <div class="video-placeholder"></div>
        </div>
    </section>

    <section id="media-sec" class="carousel-wide">
        <button class="nav-btn prev-btn" onclick="moveSlide(-1)">❮</button>
        <div class="track" id="track-imgs"></div>
        <button class="nav-btn next-btn" onclick="moveSlide(1)">❯</button>
    </section>

    <section id="about" class="vision-section">
        <h2 id="vis-title" style="color:var(--gold); font-size:3rem; margin-bottom:20px;">رؤيتنا الاستراتيجية</h2>
        <p id="vis-desc" style="font-size:1.7rem; font-weight:700; line-height:1.6;">نهدف من خلال مبادرة قصص الحضارات إلى حماية النسيج المجتمعي المصري...</p>
    </section>

    <footer style="text-align:center; padding:60px; color:var(--gold); background: rgba(0,0,0,0.95); border-top:1px solid var(--gold);">
        <p id="footer-txt">© 2026 CiviStories | جميع الحقوق محفوظة</p>
    </footer>

    <script>
        let currentLang = 'ar';
        let currentSlide = 0;
        let imagesList = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg","11.jpg","12.png","13.jpg","15.jpg","17.jpg","18.jpg","20.jpg","21.jpg","25.jpg","31.jpg","35.jpg","45.jpg","47.jpg","48.jpg","64.jpg","75.jpg","79.jpg","23.png","82.png"];

        function initPage() {
            window.scrollTo(0, 0);
            const track = document.getElementById('track-imgs');
            track.innerHTML = imagesList.map(img => `<img src="${img}" onclick="openImage('${img}')" loading="lazy">`).join('');
            updateUI();
        }

        // دالة التحريك الجديدة: تتحرك بنسبة 25% (عرض صورة واحدة)
        function moveSlide(direction) {
            const track = document.getElementById('track-imgs');
            const visiblePhotos = window.innerWidth > 768 ? 4 : 2; // 4 للكمبيوتر و 2 للموبايل
            const maxSlide = imagesList.length - visiblePhotos;

            currentSlide += direction;

            if (currentSlide > maxSlide) currentSlide = 0;
            if (currentSlide < 0) currentSlide = maxSlide;

            const shiftPercentage = (100 / visiblePhotos); 
            const multiplier = currentLang === 'ar' ? 1 : -1;
            
            track.style.transform = `translateX(${currentSlide * shiftPercentage * multiplier}%)`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            currentSlide = 0; // إعادة السلايدر للبداية عند تغيير اللغة
            document.getElementById('track-imgs').style.transform = `translateX(0)`;
            updateUI();
        }

        // نظام التكبير
        function openImage(src) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = src;
            lb.style.display = 'flex';
        }
        function closeImage() { document.getElementById('lightbox').style.display = 'none'; }
        function scrollToSec(id) { window.scrollTo({ top: document.getElementById(id).offsetTop - 120, behavior: 'smooth' }); }

        // الوظائف الباقية (Ticker, UI Updates...)
        function updateUI() {
            // كود الـ UI المعتاد الخاص بك...
        }
    </script>
</body>
</html>
