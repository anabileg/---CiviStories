<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiviStories | تسونامي الوهم الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000;
            --yt: #FF0000; --fb: #1877F2; --tw: #ffffff; --ig: #E4405F; --tk: #ffffff; --pr: #BD081C; --in: #0077B5;
            --wa-color: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; width: 100%; }

        /* خلفية الموقع سوداء سادة تماماً */
        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: -1;
        }

        .navbar {
            min-height: 90px; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }

        .nav-container { 
            width: 95%; max-width: 1400px;
            display: flex; flex-direction: row; justify-content: space-between; align-items: center; direction: rtl;
        }
        
        .nav-right-group { display: flex; align-items: center; gap: 20px; }
        .nav-logo-img { height: 65px; }
        
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .nav-links a:hover { color: #fff; }

        .news-ticker { background: var(--red-news); color: white; height: 45px; position: fixed; top: 90px; width: 100%; z-index: 1000; display: flex; align-items: center; overflow: hidden; }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 900s linear infinite; }

        @keyframes marquee { 0% { transform: translateX(0);} 100% { transform: translateX(100%);} }

        .hero { min-height: 100vh; display: flex; align-items: center; padding: 180px 5% 60px; }
        
        /* شريط الميديا - تم إلغاء ارتفاعه لمنع ظهور أي صور */
        .carousel-wide { 
            display: none; /* إخفاء قسم الميديا تماماً لأنه مصدر الصور */
        }

        .vision-section, .glass-box { 
            text-align: center; border: 4px solid var(--gold); border-radius: 40px; padding: 60px 5%; margin: 40px 0;
            background: #000 !important; /* تأكيد اللون الأسود */
            position: relative;
        }

        .card { text-align: center; padding: 40px 25px; background: rgba(255,255,255,0.05); border-radius: 25px; border-bottom: 5px solid var(--gold); border: 1px solid rgba(212,175,55,0.2); }
        .stat-num { font-size: 3.5rem; font-weight: bold; color: var(--gold); display: block; }

        .whatsapp-float {
            position: fixed; bottom: 30px; left: 20px; background-color: var(--wa-color);
            color: #FFF; border-radius: 50px; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center; z-index: 10002;
        }

    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a onclick="scrollToSec('about')">رؤيتنا</a>
                <a onclick="scrollToSec('inst')">الشركاء</a>
                <a onclick="scrollToSec('stats')">إحصائيات</a>
                <a onclick="scrollToSec('losses')">خسائر</a>
                <a href="https://forms.gle/1Ua2keC6kUvTbivK6" target="_blank">رأيك يهمنا</a>
            </div>
            <div class="nav-right-group">
                <img src="logo.png" class="nav-logo-img">
            </div>
        </div>
    </nav>

    <div class="news-ticker"><div class="ticker-track" id="tickerTrack"><span>بث مباشر: تسونامي الوهم الرقمي.. حماية الأسرة واجب وطني</span></div></div>

    <section class="hero" id="home">
        <div style="text-align:center; width: 100%;">
            <img src="CIVISTORIES Book.png" style="max-width:300px; border:2px solid var(--gold); border-radius:15px;">
            <br><br>
            <a href="https://heyzine.com/flip-book/48ab3792ec.html" target="_blank" style="color:var(--gold); font-size:1.5rem; font-weight:bold;">تصفح الكتاب الرقمي</a>
        </div>
    </section>

    <section id="about" class="vision-section">
        <h2 style="color:var(--gold); font-size:2.5rem;">رؤيتنا الاستراتيجية</h2>
        <p style="font-size:1.5rem; margin-top:20px;">حماية المجتمع من مخاطر الإدمان الرقمي واستعادة الوعي الأسري.</p>
    </section>

    <section id="stats" class="section">
        <div class="glass-box">
            <h2 style="color:var(--gold);">إحصائيات</h2>
            <div style="display:flex; justify-content:space-around; margin-top:30px;">
                <div class="card"><span class="stat-num">311</span><p>ألف حالة طلاق سنوياً</p></div>
                <div class="card"><span class="stat-num">104</span><p>مليون هاتف محمول</p></div>
            </div>
        </div>
    </section>

    <script>
        // إفراغ أي صور كانت تُستدعى سابقاً
        const imagesList = []; 
        
        function initPage() {
            console.log("الموقع يعمل بدون صور خلفية");
        }
        
        function scrollToSec(id) {
            window.scrollTo({ top: document.getElementById(id).offsetTop - 120, behavior: 'smooth' });
        }
    </script>
</body>
</html>
