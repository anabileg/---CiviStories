<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار اللون والتقسيم</title>
    <style>
        /* تغيير الخلفية للأحمر للتأكد من أن المتصفح يقرأ هذا الملف */
        body { 
            background-color: #ff0000 !important; 
            color: white; 
            margin: 0; 
            font-family: sans-serif; 
        }

        .test-container {
            width: 100%;
            height: 300px;
            display: flex;
            border: 5px solid yellow;
            margin-top: 100px;
        }

        .box {
            /* عرض المربع 25% من الشاشة ليظهر 4 مربعات بجانب بعضها */
            width: 25%;
            min-width: 25%;
            height: 100%;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.5);
            font-size: 24px;
            font-weight: bold;
        }

        h1 { text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <h1>إذا كان اللون أحمر، فأنت تشاهد النسخة الصحيحة</h1>
    
    <div class="test-container">
        <div class="box">مربع 1</div>
        <div class="box">مربع 2</div>
        <div class="box">مربع 3</div>
        <div class="box">مربع 4</div>
    </div>

</body>
</html>
