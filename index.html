<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviStories - وعي مجتمعي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #0b0b0b; 
            color: #f1f1f1; 
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* يمنع التمرير الجانبي في الهواتف */
        }
        .header {
            background: #000;
            padding: 20px 0;
            border-bottom: 3px solid #d4af37;
        }
        .logo {
            width: 150px; /* حجم أصغر قليلاً ليناسب الموبايل */
            max-width: 40%; /* لا يتجاوز 40% من عرض الشاشة */
            height: auto;
            border-radius: 50%;
            border: 2px solid #d4af37;
        }
        .container { 
            max-width: 90%; /* يشغل معظم الشاشة في الهواتف */
            width: 900px; 
            margin: 20px auto; 
            background: #181818; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }
        h1 { color: #d4af37; font-size: 1.8em; margin-bottom: 10px; }
        
        /* قسم اليوتيوب المتجاوب */
        .youtube-section {
            background: #c4302b;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            text-decoration: none;
            display: block;
        }
        .yt-button {
            background: #fff;
            color: #c4302b;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .goals-box { 
            text-align: right; 
            background: #222; 
            padding: 15px 25px; 
            border-right: 5px solid #d4af37; 
            border-radius: 10px; 
            font-size: 0.95em;
        }

        /* شبكة الإحصائيات المتجاوبة */
        .stats-container { 
            display: flex; 
            flex-direction: column; /* ترتيب رأسي للهواتف */
            gap: 15px; 
            margin-top: 25px; 
        }
        
        /* التحول للترتيب العرضي في الشاشات الكبيرة */
        @media (min-width: 600px) {
            .stats-container { flex-direction: row; }
            h1 { font-size: 2.5em; }
            .container { padding: 40px; }
            .logo { width: 200px; }
        }

        .stat-card { background: #d4af37; color: #000; padding: 20px; border-radius: 15px; flex: 1; font-weight: bold; }
        .stat-number { font-size: 2.2em; display: block; }
        .footer { padding: 30px 0; color: #666; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="header">
        <img src="Civis%20%D9%82%D8%B5%D8%B5%20%D8%A7%D9%84%D8%AD%D8%B6%D8%A7%D8%B1%D8%A7%D8%AA.png" alt="CiviStories Logo" class="logo">
    </div>

    <div class="container">
        <h1>مشروع CiviStories</h1>
        <p style="color: #ccc;">مبادرة توعوية ضد أخطار سوء استخدام السوشيال ميديا</p>

        <a href="https://www.youtube.com/@CiviStories" target="_blank" class="youtube-section">
            <h3 style="margin:0;">🎥 اشترك في قناتنا الرسمية</h3>
            <div class="yt-button">YouTube</div>
        </a>

        <div class="goals-box">
            <h3 style="color: #d4af37; margin-top: 0;">أهدافنا:</h3>
            <ul style="padding-right: 20px; margin-bottom: 0;">
                <li>نشر الوعي بمخاطر الإدمان الرقمي.</li>
                <li>حماية الروابط الأسرية من التفكك.</li>
            </ul>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-number">70%</span>
                <span>خلافات أسرية</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">40%</span>
                <span>عزلة اجتماعية</span>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 CiviStories - جميع الحقوق محفوظة</p>
        </div>
    </div>

</body>
</html>
