<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviStories | حماية النسيج الاجتماعي المصري</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --dark-bg: #0b0b0b; --accent-red: #b30000; --white-text: #f1f1f1; --card-bg: #181818; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--white-text); overflow-x: hidden; }

        /* تعديل شريط الأخبار ليعمل بدون فجوات زمنية */
        .ticker-bar { 
            background: var(--accent-red); padding: 12px 0; position: fixed; 
            top: 0; width: 100%; z-index: 10002; font-weight: bold; overflow: hidden;
        }
        .ticker-wrap { display: flex; width: 100%; }
        .ticker-container { 
            display: inline-block; white-space: nowrap; 
            animation: moveTicker 30s linear infinite; /* سرعة أكبر لتكرار أسرع */
        }
        .ticker-item { display: inline-block; padding-left: 50px; font-size: 1.1em; color: #fff; }
        @keyframes moveTicker { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(100%); } 
        }

        /* شريط الأيقونات العلوي */
        .top-nav { 
            background: rgba(0,0,0,0.95); padding: 12px 5%; position: fixed; top: 45px; 
            width: 100%; z-index: 10001; border-bottom: 1px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center;
        }
        .social-links { display: flex; gap: 15px; }
        .social-links a { color: var(--gold); text-decoration: none; font-size: 1.4em; transition: 0.3s; }
        .wa-btn { background: var(--gold); color: #000; padding: 6px 15px; border-radius: 20px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 8px; }

        /* القسم الرئيسي: الغلاف والسلايدر */
        .main-hero { 
            display: flex; align-items: flex-start; justify-content: center; gap: 40px; 
            padding: 160px 5% 40px; flex-wrap: wrap; 
        }
        .cover-box { flex: 0 0 300px; text-align: center; }
        .cover-link { text-decoration: none; color: inherit; }
        .cover-img { width: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #333; }
        .press-here { display: block; margin-top: 15px; color: var(--gold); font-weight: bold; font-size: 1.2em; animation: flash 1.5s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* سلايدر الصور */
        .slider-area { flex: 1; min-width: 320px; height: 420px; overflow: hidden; position: relative; background: #000; border-radius: 15px; }
        .photo-track { display: flex; position: absolute; top: 50%; transform: translateY(-50%); animation: scroll 100s linear infinite; }
        .photo-track img { height: 350px; margin: 0 10px; border-radius: 8px; border: 1px solid #222; }
        @keyframes scroll { 0% { left: 0; } 100% { left: -5000px; } }

        /* الإحصائيات */
        .stats-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px 10%; }
        .stat-item { background: var(--card-bg); padding: 35px; border-radius: 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .stat-item h2 { color: var(--gold); font-size: 2.5em; }

        footer { padding: 40px; text-align: center; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="ticker-bar">
        <div class="ticker-wrap">
            <div class="ticker-container" id="ticker">
                </div>
        </div>
    </div>

    <nav class="top-nav">
        <div class="social-links">
            <a href="https://www.facebook.com/profile.php?id=100093677167187" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://x.com" target="_blank"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/civistoriesarabic/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@civistoriesarabic" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@CiviStories" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="mailto:info@civistories.com" target="_blank"><i class="fas fa-envelope"></i></a>
        </div>
        <a href="https://wa.me/201009995015" target="_blank" class="wa-btn">تواصل الآن <i class="fab fa-whatsapp"></i></a>
    </nav>

    <div class="main-hero">
        <div class="cover-box">
            <a href="https://heyzine.com/flip-book/48ab3792ec.html" target="_blank" class="cover-link">
                <img src="CIVISTORIES Book.png" class="cover-img">
                <h1 style="color:var(--gold); margin-top:15px; font-size: 1.6em;">تسونامي الوهم الرقمي</h1>
                <span class="press-here">مطلوب الضغط هنا <i class="fas fa-mouse-pointer"></i></span>
            </a>
        </div>
        <div class="slider-area">
            <div class="photo-track" id="dynamicTrack"></div>
        </div>
    </div>

    <section class="stats-section">
        <div class="stat-item"><h2>٣ دقائق</h2><p>بين كل حالة طلاق وأخرى</p></div>
        <div class="stat-item"><h2>٢٥٥ حالة</h2><p>إجمالي حالات الطلاق يومياً</p></div>
        <div class="stat-item"><h2>٤٠%</h2><p>بسبب السوشيال ميديا</p></div>
    </section>

    <footer>© 2024 CiviStories - حماية النسيج الاجتماعي المصري</footer>

    <script>
        // معالجة تكرار شريط الأخبار فوراً
        const tickerContent = "• إنذار أحمر: كل ٣ دقائق حالة طلاق جديدة بسبب السوشيال ميديا • ٢٥٥ حالة طلاق يومية • ٤٠% بسبب الوهم الرقمي • ١٠٤ مليون محمول بوابات للجحيم الأسري • ";
        document.getElementById('ticker').innerHTML = tickerContent.repeat(5);

        // سلايدر الصور الميدانية
        const pngList = [12, 14, 19, 23, 24, 32, 59, 60, 70, 73, 81, 82];
        const track = document.getElementById('dynamicTrack');
        let content = '';
        for(let i=1; i<=82; i++) {
            let ext = pngList.includes(i) ? 'png' : 'jpg';
            content += `<img src="${i}.${ext}" onerror="this.style.display='none'">`;
        }
        track.innerHTML = content + content;
    </script>
</body>
</html>
