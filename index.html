<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiviStories | فحص الملفات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000; --wa-color: #25D366; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { color: var(--white); font-family: sans-serif; background: #000; overflow-x: hidden; }
        .site-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('image_390e08.jpg'); background-size: cover; z-index: -1; filter: brightness(0.4); }
        .carousel-wide { width: 100%; height: 600px; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); position: relative; overflow: hidden; margin: 100px 0; background: #111; display: flex; align-items: center; }
        .track { display: flex; transition: transform 0.5s ease-in-out; width: 100%; }
        .img-wrapper { min-width: 100%; height: 600px; position: relative; display: flex; justify-content: center; align-items: center; }
        .img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .img-name-tag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: red; color: white; padding: 5px 15px; font-weight: bold; z-index: 100; border-radius: 5px; font-size: 20px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--gold); color: #000; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.5rem; }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }
    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>

    <h1 style="text-align:center; color:var(--gold); margin-top:120px;">شاشة فحص أسماء الصور</h1>
    <p style="text-align:center;">انظر للاسم المكتوب باللون الأحمر فوق صورة "الرجل الغارق" وأخبرني به.</p>

    <section class="carousel-wide">
        <button class="nav-btn prev-btn" onclick="moveSlide(-1)">❮</button>
        <div class="track" id="track-imgs"></div>
        <button class="nav-btn next-btn" onclick="moveSlide(1)">❯</button>
    </section>

    <script>
        let currentSlide = 0;
        // القائمة الحالية للفحص
        let imagesList = ["2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg","11.jpg","12.png","13.jpg","15.jpg","17.jpg","18.jpg","20.jpg","21.jpg","25.jpg","31.jpg","35.jpg","45.jpg","47.jpg","48.jpg","64.jpg","75.jpg","79.jpg","23.png","82.png"];

        function initPage() {
            const track = document.getElementById('track-imgs');
            // كود الفحص: يضع اسم الملف فوق كل صورة
            track.innerHTML = imagesList.map(img => `
                <div class="img-wrapper">
                    <span class="img-name-tag">${img}</span>
                    <img src="${img}">
                </div>
            `).join('');
        }

        function moveSlide(direction) {
            const track = document.getElementById('track-imgs');
            currentSlide += direction;
            if (currentSlide >= imagesList.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = imagesList.length - 1;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
    </script>
</body>
</html>
