<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CiviStories | تسونامي الوهم الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --gold: #d4af37; --white: #ffffff; --red-news: #b30000; --red-num: #ff0000;
            --yt: #FF0000; --fb: #1877F2; --wa-color: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { color: var(--white); font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; overflow-x: hidden; width: 100%; }

        /* الخلفية المتحركة */
        .site-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_390e08.jpg'); background-position: center; background-size: cover; z-index: -1;
            animation: kenBurns 35s ease-in-out infinite alternate;
        }
        @keyframes kenBurns { 0% { transform: scale(1); filter: brightness(0.35);} 100% { transform: scale(1.18); filter: brightness(0.55);} }

        /* الهيدر */
        .navbar {
            min-height: 90px; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            position: fixed; top: 0; width: 100%; z-index: 10001; border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-container { width: 95%; max-content; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: var(--gold); text-decoration: none; font-weight: bold; margin-left: 20px; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
        .nav-right-group { display: flex; align-items: center; gap: 20px; }

        /* شريط الأخبار */
        .news-ticker { background: var(--red-news); color: white; height: 45px; position: fixed; top: 90px; width: 100%; z-index: 1000; display: flex; align-items: center; overflow: hidden; }
        .ticker-track { display: flex; white-space: nowrap; animation: marquee 600s linear infinite; }
        .ticker-track span { padding-left: 100px; font-weight: bold; }
        @keyframes marquee { 0% { transform: translateX(0);} 100% { transform: translateX(100%);} }

        /* قسم الهيرو */
        .hero { min-height: 100vh; display: flex; align-items: center; padding: 180px 5% 60px; }
        .hero-container { display: flex; gap: 40px; width: 100%; align-items: center; justify-content: center; }
        .book-wrapper img { width: 320px; border-radius: 15px; border: 2px solid var(--gold); animation: bookFloat 3s ease-in-out infinite; }
        @keyframes bookFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .video-placeholder { flex: 1; height: 450px; border: 2px solid var(--gold); border-radius: 20px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }

        /* --- المعرض الرباعي المثالي --- */
        .carousel-wide { 
            width: 100%; height: 450px; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); 
            position: relative; overflow: hidden; margin: 60px 0; background: #000;
        }
        .track { 
            display: flex; transition: transform 0.6s ease-in-out; 
            width: max-content; /* هام جداً لجعل الصور بجانب بعضها */
        }
        .track img { 
            width: 25vw !important; /* فرض ربع عرض الشاشة تماماً */
            height: 450px; object-fit: contain; padding: 15px; cursor: zoom-in;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: var(--gold);
            color: #000; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 100; font-size: 1.5rem;
        }
        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }

        /* الصناديق الزجاجية والأقسام */
        .glass-box { 
            text-align: center; border: 4px solid var(--gold); border-radius: 40px; padding: 60px 5%; margin: 40px 5%;
            background: rgba(0,0,0,0.7); position: relative;
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 40px; }
        .card { padding: 40px; background: rgba(255,255,255,0.05); border-radius: 25px; border-bottom: 5px solid var(--gold); }
        .stat-num { font-size: 3.5rem; font-weight: bold; color: var(--gold); display: block; }
        .loss-num { color: var(--red-num) !important; }

        /* Lightbox */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 20000; }
        .lightbox img { max-width: 90%; max-height: 85%; border: 3px solid var(--gold); }
    </style>
</head>
<body onload="initPage()">

    <div class="site-bg"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a onclick="scrollToSec('media-sec')">ميديا</a>
                <a onclick="scrollToSec('stats')">إحصائيات</a>
                <a onclick="scrollToSec('losses')">الخسائر</a>
                <a href="https://forms.gle/1Ua2keC6kUvTbivK6" target="_blank">رأيك يهمنا</a>
            </div>
            <div class="nav-right-group">
                <button class="lang-toggle" style="background:var(--gold); padding:8px 15px; border-radius:5px; font-weight:bold;">English</button>
                <img src="logo.png" style="height: 65px;">
            </div>
        </div>
    </nav>

    <div class="news-ticker"><div class="ticker-track" id="tickerTrack"></div></div>

    <section class="hero">
        <div class="hero-container">
            <div class="book-static">
                <div class="book-wrapper"><img src="CIVISTORIES Book.png"></div>
                <a href="#" class="btn-action" style="background:var(--gold); color:#000; display:block; padding:15px; margin-top:20px; text-decoration:none; font-weight:bold; border-radius:10px; text-align:center;">تصفح الكتاب</a>
            </div>
            <div class="video-placeholder">
                <i class="fas fa-play-circle" style="font-size: 6rem; color: var(--gold); cursor: pointer;"></i>
            </div>
        </div>
    </section>

    <section id="media-sec" class="carousel-wide">
        <button class="nav-btn prev-btn" onclick="moveSlide(1)">❮</button>
        <div class="track" id="track-imgs"></div>
        <button class="nav-btn next-btn" onclick="moveSlide(-1)">❯</button>
    </section>

    <section id="stats" class="section">
        <div class="glass-box">
            <h2 style="color:var(--gold); font-size: 2.5rem;">إحصائيات الواقع الرقمي</h2>
            <div class="grid">
                <div class="card"><span class="stat-num counter" data-target="311">0</span><p>ألف حالة طلاق سنوياً</p></div>
                <div class="card"><span class="stat-num counter" data-target="104">0</span><p>مليون هاتف محمول</p></div>
                <div class="card"><span class="stat-num counter" data-target="255">0</span><p>حالة طلاق يومياً</p></div>
            </div>
        </div>
    </section>

    <section id="losses" class="section">
        <div class="glass-box" style="border-color: var(--red-num);">
            <h2 style="color:var(--gold); font-size: 2.5rem;">الخسائر الوطنية</h2>
            <div class="grid">
                <div class="card" style="border-bottom-color: var(--red-num);"><span class="stat-num loss-num counter" data-target="15">0</span><p>مليار جنيه خسائر إنتاجية</p></div>
                <div class="card" style="border-bottom-color: var(--red-num);"><span class="stat-num loss-num counter" data-target="4">0</span><p>مليارات تكلفة العلاج النفسي</p></div>
                <div class="card" style="border-bottom-color: var(--red-num);"><span class="stat-num loss-num counter" data-target="2">0</span><p>مليار جنيه خسائر احتيال رقمي</p></div>
            </div>
        </div>
    </section>

    <div id="lightbox" class="lightbox" onclick="this.style.display='none'"><img id="lightbox-img"></div>

    <script>
        const imagesList = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg"];
        let currentSlide = 0;

        function initPage() {
            const track = document.getElementById('track-imgs');
            track.innerHTML = imagesList.map(img => `<img src="${img}" onclick="openImage('${img}')">`).join('');
            
            const tickerTrack = document.getElementById('tickerTrack');
            const news = "• الأزهر الشريف: حالة طلاق كل دقيقتين بسبب الإدمان الرقمي • وزارة الأوقاف: الهواتف سبب رئيسي للخرس الزوجي • إنذار أحمر: التفكك الأسري يهدد الاستقرار المجتمعي";
            tickerTrack.innerHTML = `<span>${news}</span><span>${news}</span>`;
        }

        function moveSlide(direction) {
            const track = document.getElementById('track-imgs');
            const step = 25; // تحريك بمقدار ربع شاشة
            const maxSlides = imagesList.length - 4; // التوقف عند آخر 4 صور

            currentSlide += direction;
            if (currentSlide > maxSlides) currentSlide = 0;
            if (currentSlide < 0) currentSlide = maxSlides;

            track.style.transform = `translateX(${currentSlide * step}vw)`;
        }

        function openImage(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function scrollToSec(id) {
            window.scrollTo({ top: document.getElementById(id).offsetTop - 100, behavior: 'smooth' });
        }

        // عداد الأرقام
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const target = +el.getAttribute('data-target');
                    let count = 0;
                    const update = setInterval(() => {
                        count += Math.ceil(target/50);
                        if (count >= target) { el.innerText = target; clearInterval(update); }
                        else { el.innerText = count; }
                    }, 30);
                }
            });
        });
        document.querySelectorAll('.counter').forEach(c => observer.observe(c));
    </script>
</body>
</html>
